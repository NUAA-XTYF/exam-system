{% extends "layout/basic.html" %}
{% block content %}
<link rel="stylesheet" href="/exam-monitor.css?v=6">
<section class="section em">
  <div class="em-head">
    <div>
      <h1>考试监考</h1>
      <div class="em-sub">{{ monitorTitle }}</div>
    </div>
    <div class="em-spacer"></div>
    <div class="em-actions">
      <button data-action="start" class="primary">开始监考</button>
      <label><input type="checkbox" id="autostop" checked> 到比赛结束时间自动停止</label>
      <button data-action="stop">停止监考</button>
      <button data-action="importFromLogin">按登录 IP 生成映射</button><button id="em-records">全部记录</button>
    </div>
  </div>
  <p class="em-msg" id="em-msg" role="status"></p>
  <div class="em-stats" id="em-stats"></div>
  <details class="em-details">
    <summary>手工导入映射（粘贴 JSON）</summary>
    <div class="em-details-body">
      <textarea id="mapping" placeholder='[{"studentId":101,"deviceId":"ip-192-168-3-101"}]'></textarea>
      <button data-action="import">导入映射</button>
    </div>
  </details>
  <div class="em-grid" id="em-grid"></div>
</section>
<div class="em-modal" id="em-modal">
  <div class="em-modal-box">
    <div class="em-modal-head"><h2 id="em-modal-title">历史画面</h2><button class="em-close" id="em-modal-close" title="关闭">×</button></div>
    <div class="em-modal-body" id="em-modal-body"></div>
  </div>
</div>
<script src="/exam-monitor.js?v=6" defer></script>
{% endblock %}
